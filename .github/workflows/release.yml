name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  TRIGGER_REF: ${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Validate tag and app version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          if test "$GITHUB_EVENT_NAME" = "workflow_dispatch"; then
            test "$TRIGGER_REF" = "refs/tags/$RELEASE_TAG"
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          version_name="$(perl -ne 'print $1 if /versionName = "([^\"]+)"/' app/build.gradle.kts)"
          version_code="$(perl -ne 'print $1 if /versionCode = ([0-9]+)/' app/build.gradle.kts)"
          test -n "$version_name"
          test -n "$version_code"
          test "$RELEASE_TAG" = "v$version_name"
          max_previous_version_code=0
          max_previous_tag=""
          while IFS= read -r tag; do
            if test "$tag" = "$RELEASE_TAG"; then
              continue
            fi
            previous_version_code="$(
              git show "$tag:app/build.gradle.kts" |
                perl -ne 'print $1 if /versionCode = ([0-9]+)/'
            )"
            test -n "$previous_version_code"
            if test "$previous_version_code" -gt "$max_previous_version_code"; then
              max_previous_version_code="$previous_version_code"
              max_previous_tag="$tag"
            fi
          done < <(git tag --list 'v*')
          if test -n "$max_previous_tag"; then
            test "$version_code" -gt "$max_previous_version_code"
          fi

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Test, lint, and build unsigned artifacts
        shell: bash
        run: ./gradlew --no-build-cache clean test lint assembleDebug stageReleaseSbomInputs

      - name: Verify release privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          aapt2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          manifest_dump="$RUNNER_TEMP/release-manifest.txt"
          resources_dump="$RUNNER_TEMP/release-resources.txt"

          for required_file in "$apk" "$aapt2"; do
            if ! test -f "$required_file"; then
              printf 'Required release privacy input is missing: %s\n' "$required_file" >&2
              exit 1
            fi
          done

          "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" > "$manifest_dump"
          "$aapt2" dump resources "$apk" > "$resources_dump"

          require_text() {
            local file="$1"
            local text="$2"
            local message="$3"
            if ! EXPECTED_TEXT="$text" \
              perl -0777 -ne 'exit(index($_, $ENV{EXPECTED_TEXT}) >= 0 ? 0 : 1)' "$file"; then
              printf '%s\n' "$message" >&2
              exit 1
            fi
          }

          require_text \
            "$manifest_dump" \
            ':allowBackup(0x01010280)=false' \
            'Release APK must set android:allowBackup="false".'

          full_backup_id="$(
            perl -ne 'print lc($1) if /:fullBackupContent\([^)]*\)=@(0x[0-9a-fA-F]+)/' \
              "$manifest_dump"
          )"
          data_extraction_id="$(
            perl -ne 'print lc($1) if /:dataExtractionRules\([^)]*\)=@(0x[0-9a-fA-F]+)/' \
              "$manifest_dump"
          )"
          if test -z "$full_backup_id" || test -z "$data_extraction_id"; then
            echo 'Release APK must declare both Android backup-rule attributes.' >&2
            exit 1
          fi
          require_text \
            "$resources_dump" \
            "resource $full_backup_id xml/backup_rules" \
            'android:fullBackupContent must reference @xml/backup_rules.'
          require_text \
            "$resources_dump" \
            "resource $data_extraction_id xml/data_extraction_rules" \
            'android:dataExtractionRules must reference @xml/data_extraction_rules.'

          for permission in \
            android.permission.INTERNET \
            android.permission.ACCESS_BACKGROUND_LOCATION \
            android.permission.READ_EXTERNAL_STORAGE \
            android.permission.WRITE_EXTERNAL_STORAGE \
            android.permission.MANAGE_EXTERNAL_STORAGE; do
            if FORBIDDEN_PERMISSION="$permission" \
              perl -ne '$found = 1 if index($_, $ENV{FORBIDDEN_PERMISSION}) >= 0; END { exit($found ? 0 : 1) }' \
              "$manifest_dump"; then
              printf 'Forbidden permission in release APK: %s\n' "$permission" >&2
              exit 1
            fi
          done

      - name: Generate SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/syft.tar.gz"
          tool_dir="$RUNNER_TEMP/syft"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/anchore/syft/releases/download/v1.42.3/syft_1.42.3_linux_amd64.tar.gz
          printf '%s  %s\n' \
            0d6be741479eddd2c8644a288990c04f3df0d609bbc1599a005532a9dff63509 \
            "$archive" | sha256sum --check --strict
          mkdir -p "$tool_dir"
          tar --extract --gzip --file "$archive" --directory "$tool_dir" syft
          "$tool_dir/syft" scan dir:app/build/sbom-inputs \
            --exclude '**/resolved-artifacts/**' \
            --source-name speedometer \
            --source-version "${RELEASE_TAG#v}" \
            --output "spdx-json=speedometer-${RELEASE_TAG}.spdx.json"

      - name: Package build inputs
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/app-release-unsigned.apk
          cp "speedometer-${RELEASE_TAG}.spdx.json" dist/
          git archive \
            --format=zip \
            --prefix="speedometer-${RELEASE_TAG}/" \
            --output="dist/speedometer-${RELEASE_TAG}-source.zip" \
            HEAD

      - name: Preserve unsigned build inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download unsigned build inputs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: unsigned-${{ env.RELEASE_TAG }}
          path: inputs

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install APK signer
        shell: bash
        run: sdkmanager "build-tools;35.0.0"

      - name: Sign APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          configured=0
          for value in \
            "$RELEASE_KEYSTORE_BASE64" \
            "$RELEASE_KEY_ALIAS" \
            "$RELEASE_KEY_PASSWORD" \
            "$RELEASE_STORE_PASSWORD" \
            "$RELEASE_CERT_SHA256"; do
            if test -n "$value"; then
              configured=$((configured + 1))
            fi
          done

          if test "$configured" -ne 5; then
            echo "Stable release signing requires all five release-signing environment secrets." >&2
            exit 1
          fi
          trap 'rm -f release-key.jks' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release-key.jks \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out "dist/speedometer-${RELEASE_TAG}.apk" \
            inputs/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            "dist/speedometer-${RELEASE_TAG}.apk"
          actual_cert_sha256="$(
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
              "dist/speedometer-${RELEASE_TAG}.apk" |
              perl -ne 'print lc($1) if /Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)/'
          )"
          expected_cert_sha256="$(printf '%s' "$RELEASE_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$actual_cert_sha256"
          test "$actual_cert_sha256" = "$expected_cert_sha256"

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          cp "inputs/speedometer-${RELEASE_TAG}-source.zip" dist/
          cp "inputs/speedometer-${RELEASE_TAG}.spdx.json" dist/
          (cd dist && sha256sum *.apk *.json *.zip > SHA256SUMS.txt)

      - name: Attest release assets
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*.apk
            dist/*.json
            dist/*.zip

      - name: Preserve release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: speedometer-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: speedometer-${{ env.RELEASE_TAG }}
          path: dist

      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS.txt)
          flags=(--verify-tag --generate-notes --latest --title "Speedometer $RELEASE_TAG")
          gh release create \
            "$RELEASE_TAG" \
            dist/*.apk \
            dist/*.json \
            dist/*.zip \
            dist/SHA256SUMS.txt \
            "${flags[@]}" \
            --repo "$GITHUB_REPOSITORY"
          test "$(
            gh release view "$RELEASE_TAG" \
              --json isDraft \
              --jq '.isDraft' \
              --repo "$GITHUB_REPOSITORY"
          )" = "false"
          test "$(
            gh release view "$RELEASE_TAG" \
              --json isPrerelease \
              --jq '.isPrerelease' \
              --repo "$GITHUB_REPOSITORY"
          )" = "false"
